<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loop in JavaScript</title>
</head>
<body>
    <h1>Loop in JavaScript</h1>
    <p>Loops are used to repeat a block of code until a specified condition is met. JavaScript supports several types of loops, including:</p>

    <select id="country">
        <option value="Select a country">Select a country</option>
    </select>

    <!-- list of countries in table -->
    <table id="country_table" border="1">
        <thead id="country_table_head">
        </thead>
        <tbody id="country_table_body">
        </tbody>
    </table>
    <script>
        for (let step = 0; step < 5; step++) {
            // Runs 5 times, with values of step 0 through 4.
            console.log(`Walking east one step ${step}`);
        }

        // adding options to select element using for loop
        const countries = ['India', 'USA', 'UK', 'Australia', 'Canada'];
        const selectElement = document.getElementById('country');
        for (let i = 0; i < countries.length; i++) {
            const option = document.createElement('option');
            option.value = countries[i];
            option.textContent = countries[i];
            selectElement.appendChild(option);
        }

        // columns of table
        const columns = ['Name', 'Capital', 'Population'];
        const tableHead = document.getElementById('country_table_head');
        const headerRow = document.createElement('tr');
        for (let i = 0; i < columns.length; i++) {
            const th = document.createElement('th');
            th.textContent = columns[i];
            headerRow.appendChild(th);
        }
        tableHead.appendChild(headerRow);
        // rows of table
        const countryData = [
            { name: 'India', capital: 'New Delhi', population: '1.3 billion' },
            { name: 'USA', capital: 'Washington D.C.', population: '331 million' },
            { name: 'UK', capital: 'London', population: '67 million' },
            { name: 'Australia', capital: 'Canberra', population: '25 million' },
            { name: 'Canada', capital: 'Ottawa', population: '38 million' }
        ];
        const tableBody = document.getElementById('country_table_body');
        for (let i = 0; i < countryData.length; i++) {
            const row = document.createElement('tr');
            const nameCell = document.createElement('td');
            nameCell.textContent = countryData[i].name;
            row.appendChild(nameCell);
            const capitalCell = document.createElement('td');
            capitalCell.textContent = countryData[i].capital;
            row.appendChild(capitalCell);
            const populationCell = document.createElement('td');
            populationCell.textContent = countryData[i].population;
            row.appendChild(populationCell);
            tableBody.appendChild(row);
        }


        // do while loop example
        let i = 0;
        do {
            i += 1;
            console.log(i);
        } while (i < 5);

        // while loop example
        let n = 0;
        let x = 0;
        while (n < 3) {
            n++;
            x += n;
            console.log("value of x: " + x);
            console.log("value of n: " + n);
        }
        console.log("same value with different case");
        n = 0;
        x = 0;
        while (n < 3) {
            console.log("value of x: " + x);
            console.log("value of n: " + n);
            n++;
            x += n;
        }

        // for in loop example
        const person = { fname: "John", lname: "Doe", age: 25 };
        for (let key in person) {
            console.log(key + ": " + person[key]);
        }
        // using for in loop for object with nested object
        const student = {
            name: "Alice",
            age: 22,
            subjects: {
                math: 85,
                english: 90,
                science: 92
            }
        };
        for (let key in student) {
            if (typeof student[key] === 'object') {
                console.log(key + ":");
                for (let subKey in student[key]) {
                    console.log("  " + subKey + ": " + student[key][subKey]);
                }
            } else {
                console.log(key + ": " + student[key]);
            }
        }

        // for of loop example
        const arr = [3, 5, 7];
        arr.foo = "hello";

        for (const i in arr) {
            console.log(i);
        }
        // "0" "1" "2" "foo"

        for (const i of arr) {
            console.log(i);
        }
        // Logs: 3 5 7
    </script>
</body>
</html>
